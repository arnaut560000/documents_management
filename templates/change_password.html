{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="glass-panel p-4 p-lg-5">
            <span class="eyebrow mb-3">Password Update</span>
            <h2 class="panel-title mb-2">Change your password</h2>
            <p class="section-copy mb-4">For pilot deployment safety, initial passwords must be replaced before continuing into the system.</p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" name="current_password" class="form-control modern-input" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control modern-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control modern-input" required>
                </div>
                <button type="submit" class="btn btn-primary-soft w-100">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
