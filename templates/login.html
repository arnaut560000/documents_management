{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="glass-panel p-4 p-lg-5">
            <span class="eyebrow mb-3">Secure Access</span>
            <h2 class="panel-title mb-2">Login</h2>
            <p class="section-copy mb-4">Use your assigned NEECO DMS account. Inactive users cannot sign in, and initial passwords must be changed after login.</p>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control modern-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control modern-input" required>
                </div>
                <button type="submit" class="btn btn-dark-soft w-100">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
