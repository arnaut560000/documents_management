{% extends 'base.html' %}
{% block content %}
<div class="page-heading mb-4">
    <div>
        <span class="eyebrow">Edit User</span>
        <h1 class="section-title">Update account details</h1>
        <p class="section-copy">You can deactivate users without deleting them. If you set a new password here, the user will be required to change it on next login.</p>
    </div>
    <a href="{{ url_for('users') }}" class="btn btn-outline-modern">Back</a>
</div>

<form method="POST" class="glass-panel p-4 p-lg-5">
    <div class="row g-4">
        <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control modern-input" value="{{ user.full_name }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control modern-input" value="{{ user.username }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">New Password (optional)</label>
            <input type="password" name="password" class="form-control modern-input">
            <div class="form-text">Leave blank to keep the current password.</div>
        </div>
        <div class="col-md-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-select modern-input" required>
                <option value="staff" {% if user.role == 'staff' %}selected{% endif %}>Staff</option>
                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Status</label>
            <select name="is_active" class="form-select modern-input" required>
                <option value="1" {% if user.is_active == 1 %}selected{% endif %}>Active</option>
                <option value="0" {% if user.is_active == 0 %}selected{% endif %}>Inactive</option>
            </select>
        </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4">
        <button type="submit" class="btn btn-primary-soft">Update User</button>
        <a href="{{ url_for('users') }}" class="btn btn-outline-modern">Cancel</a>
    </div>
</form>
{% endblock %}
