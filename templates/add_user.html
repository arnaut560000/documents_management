{% extends 'base.html' %}
{% block content %}
<div class="page-heading mb-4">
    <div>
        <span class="eyebrow">Add User</span>
        <h1 class="section-title">Create a new account</h1>
        <p class="section-copy">New users keep the current admin and staff roles, and they will be required to change their starting password on first login.</p>
    </div>
    <a href="{{ url_for('users') }}" class="btn btn-outline-modern">Back</a>
</div>

<form method="POST" class="glass-panel p-4 p-lg-5">
    <div class="row g-4">
        <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control modern-input" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control modern-input" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control modern-input" required>
            <div class="form-text">Use at least 8 characters.</div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Role</label>
            <select name="role" class="form-select modern-input" required>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>
        </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4">
        <button type="submit" class="btn btn-primary-soft">Save User</button>
        <a href="{{ url_for('users') }}" class="btn btn-outline-modern">Cancel</a>
    </div>
</form>
{% endblock %}
