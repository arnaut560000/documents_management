{% extends 'base.html' %}
{% block content %}
<div class="page-heading mb-4">
    <div>
        <span class="eyebrow">Document Intake</span>
        <h1 class="section-title">Add a new document</h1>
        <p class="section-copy">This page stays available as a fallback, but the main workflow now fits best inside the popup on the documents screen.</p>
    </div>
    <a href="{{ url_for('documents') }}" class="btn btn-dark-soft">Back to Documents</a>
</div>

<form method="POST" enctype="multipart/form-data" class="glass-panel p-4 p-lg-5">
    <div class="row g-4">
        <div class="col-md-6">
            <label class="form-label">Document No</label>
            <input type="text" name="doc_no" class="form-control modern-input" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control modern-input" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control modern-input">
        </div>
        <div class="col-md-6">
            <label class="form-label">Initial Status</label>
            <select name="current_status" class="form-select modern-input" required>
                {% for status in status_choices %}
                <option value="{{ status }}" {% if status == 'Pending' %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Who Has the Document?</label>
            <select name="holder_user_id" class="form-select modern-input">
                <option value="">-- Not Assigned --</option>
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.full_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">File</label>
            <input type="file" name="file" class="form-control modern-input">
        </div>
        <div class="col-12">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control modern-input" rows="5"></textarea>
        </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4">
        <button type="submit" class="btn btn-primary-soft">Save Document</button>
        <a href="{{ url_for('documents') }}" class="btn btn-outline-modern">Cancel</a>
    </div>
</form>
{% endblock %}
